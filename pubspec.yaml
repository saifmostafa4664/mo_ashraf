name: mo_ashraf
description: "MA TEAM - Mohamed Ashraf High-End Retoucher Portfolio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.4.6
  google_fonts: ^8.2.1
  go_router: ^17.3.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  animate_do: ^5.1.0
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/cv/
    - assets/studio/
