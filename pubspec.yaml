name: mo_ashraf
description: "MA TEAM - Mohamed Ashraf High-End Retoucher Portfolio"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.1
  google_fonts: ^6.2.1
  go_router: ^14.2.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  file_picker: ^8.0.5
  animate_do: ^3.3.4
  cached_network_image: ^3.3.1
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  font_awesome_flutter: 10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - assets/cv/